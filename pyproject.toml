[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sy-oufy-refusalq"
version = "0.1.0"
description = "按拒答理由的恰当性、解释完整性与替代建议给出评分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sy-oufy" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sy-oufy.github.io"
Repository = "https://github.com/sy-oufy/refusalq"
Issues = "https://github.com/sy-oufy/refusalq/issues"

[project.scripts]
refusalq = "refusalq:main"

[tool.setuptools]
py-modules = ["refusalq"]
